name: Daily Auto Shorts

on:
  schedule:
    # Roz 1 baar — 9:00 AM UTC (2:00 PM Pakistan time)
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      channel_url:
        description: "Override channel URL (optional)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write   # state file commit karne ke liye

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<70" wheel
          pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-build-isolation openai-whisper==20231117
          pip install -r requirements.txt

      - name: Update yt-dlp to latest
        run: pip install -U --pre "yt-dlp[default]"

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-base

      - name: Create client_secret.json
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET }}
        run: printf '%s' "$YT_CLIENT_SECRET_JSON" > client_secret.json

      - name: Create cookies.txt (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi

      - name: Run channel pipeline
        env:
          WHISPER_MODEL:    base
          YT_CLIENT_SECRET: client_secret.json
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_COOKIES_FILE:  cookies.txt
          CHANNEL_URL:      ${{ github.event.inputs.channel_url || secrets.CHANNEL_URL }}
        run: |
          python main.py --channel "$CHANNEL_URL" --upload

      - name: Commit state file
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/processed.json || true
          git diff --staged --quiet || git commit -m "chore: update processed videos [skip ci]"
          git push || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-output
          path: output/short_*.mp4
          if-no-files-found: warn
