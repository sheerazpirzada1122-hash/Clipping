name: Daily Auto Shorts

on:
  schedule:
    # Roz 1 baar — 9:00 AM UTC (2:00 PM Pakistan time)
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      channel_url:
        description: "Override channel URL (optional)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write   # state file commit karne ke liye

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-base

      - name: Create client_secret.json
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET }}
        run: echo "$YT_CLIENT_SECRET_JSON" > client_secret.json

      - name: Run channel pipeline
        env:
          WHISPER_MODEL:    base
          YT_CLIENT_SECRET: client_secret.json
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHANNEL_URL:      ${{ github.event.inputs.channel_url || secrets.CHANNEL_URL }}
        run: |
          python main.py --channel "$CHANNEL_URL" --upload

      - name: Commit state file
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/processed.json || true
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: update processed videos [skip ci]"
          git push || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-output
          path: output/*.mp4
          if-no-files-found: warn
