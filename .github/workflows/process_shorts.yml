name: Process YouTube Shorts

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "YouTube URL to process"
        required: true
      upload:
        description: "Upload to YouTube?"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-base

      - name: Run pipeline
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python main.py --source "${{ github.event.inputs.source_url }}" \
            ${{ github.event.inputs.upload == 'true' && '--upload' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output
          path: output/*.mp4
