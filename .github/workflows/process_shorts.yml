name: Process YouTube Shorts

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "YouTube URL to process"
        required: true
      upload:
        description: "Upload to YouTube?"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-base

      # 👇 YEH STEP ZAROORI HAI — secret se JSON file banata hai
      - name: Create client_secret.json from secret
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          echo "$YT_CLIENT_SECRET_JSON" > client_secret.json
          ls -la client_secret.json

      - name: Run pipeline
        env:
          WHISPER_MODEL:    base
          YT_CLIENT_SECRET: client_secret.json
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python main.py \
            --source "${{ github.event.inputs.source_url }}" \
            ${{ github.event.inputs.upload == 'true' && '--upload' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-output
          path: output/*.mp4
          if-no-files-found: warn
